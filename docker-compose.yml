version: '3.8'

# Unique project name so containers don't mix with other projects (docker compose -p aitravelplanner)
name: aitravelplanner

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    command: pnpm dev