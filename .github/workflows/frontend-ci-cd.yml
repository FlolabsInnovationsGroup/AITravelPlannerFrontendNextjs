name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Flo Labs Frontend CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"  # Next.js requires >=20.9.0
          cache: "pnpm"

      - name: Verify Node version
        run: node -e "const v = process.version; const [major, minor] = v.slice(1).split('.').map(Number); if (major < 20 || (major === 20 && minor < 9)) process.exit(1); console.log('Node', v);"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test:ci

      - name: Build application
        run: pnpm run build
